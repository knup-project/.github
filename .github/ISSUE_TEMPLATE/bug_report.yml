name: 🐛 버그 리포트
description: 동작이 기대와 다른 문제를 신고합니다.
title: "fix: "
labels: ["type:bug", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        버그를 신고해 주셔서 감사합니다! 재현 가능한 정보를 최대한 자세히 적어 주세요.
  - type: dropdown
    id: area
    attributes:
      label: 영향받는 레포/영역
      options:
        - frontend
        - backend
        - infra
        - 여러 레포에 걸침 / 모르겠음
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 무슨 일이 있었나요?
      description: 어떤 문제가 발생했는지 설명해 주세요.
      placeholder: PIN으로 입장 후 대기실에서 참가자 목록이 갱신되지 않습니다.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 절차
      value: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 환경 (브라우저/디바이스/버전 등)
      placeholder: Chrome 130 / iPhone 15 / main @ e68ecc3
  - type: textarea
    id: logs
    attributes:
      label: 로그 · 스크린샷 (선택)
      render: shell
